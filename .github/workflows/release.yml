name: 自动发布 Release

# 每次推上来一个 vX.Y 的标签，这个机器人就替我们建一个 Release，
# 顺带把两个安装包挂上去 —— 这样仓库右边那栏 "Releases" 就有东西了，
# 不需要用户点、也不需要 token（用的是仓库自己的 GITHUB_TOKEN）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 顺便把 Tailscale 的安卓 APK 拉下来（想在外面用就靠它）
        run: |
          set -e
          # 官方稳定版目录里那个 tailscale-android-universal-<版本>.apk
          APK=$(curl -sL https://pkgs.tailscale.com/stable/ \
                | grep -o 'tailscale-android-universal-[0-9.]*\.apk' | head -1)
          echo "apk=$APK"
          curl -sL -o tailscale.apk "https://pkgs.tailscale.com/stable/$APK"
          ls -l tailscale.apk
      - name: 建 Release 并挂上安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "这个标签已经有 Release 了，把附件刷新成最新的：$TAG"
            gh release upload "$TAG" app.apk pc.zip tailscale.apk --clobber
            exit 0
          fi
          # 攒下来的改动写在 release-notes.txt 里（打包时生成的），有就用它当正文
          if [ -f release-notes.txt ]; then
            NOTES_FILE=release-notes.txt
          else
            NOTES_FILE=$(mktemp)
            cat > "$NOTES_FILE" <<'EOF'
          下载页（任何地方都能打开）：
          https://hubaoao.github.io/voice-assistant-for-deepseek-codex/

          - app.apk：手机端（安卓）
          - pc.zip：电脑端（Windows，解压后双击 1-安装语音助手.cmd）
          EOF
          fi
          gh release create "$TAG" app.apk pc.zip tailscale.apk \
            --title "语音助手 $TAG" \
            --notes-file "$NOTES_FILE"
      - name: 把老 Release 删掉（只留最新这一个）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 为什么必须删：老 Release 里挂着那时候的 app.apk / pc.zip ——
          # 早期版本的手机 APP 里写死过开发机的地址和令牌，那些附件一直躺在
          # Releases 里，等于把旧口令一直挂在公网上。只留最新一个，既清掉这些，
          # 也免得下载列表越来越长。
          KEEP="${GITHUB_REF_NAME}"
          echo "保留：$KEEP"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            if [ "$t" != "$KEEP" ]; then
              echo "删掉老版本：$t"
              gh release delete "$t" --yes --cleanup-tag=false || true
            fi
          done
          echo "剩下的："
          gh release list --limit 20
